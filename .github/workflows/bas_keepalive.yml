name: SAP BAS Keep Alive

on:
  workflow_dispatch:

  schedule:
    - cron: "*/60 * * * *"

permissions:
  contents: read

concurrency:
  group: sap-bas-keepalive
  cancel-in-progress: true

jobs:

  keep-alive:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Start / Keep SAP BAS Dev Space
        env:
          BAS_URL: ${{ secrets.BAS_URL }}
          BAS_USERNAME: ${{ secrets.BAS_USERNAME }}
          BAS_PASSWORD: ${{ secrets.BAS_PASSWORD }}
          BAS_DEVSPACE: ${{ secrets.BAS_DEVSPACE }}
          BAS_DEVSPACE_ID: ${{ secrets.BAS_DEVSPACE_ID }}
          BAS_PROJECT_URL: ${{ secrets.BAS_PROJECT_URL }}

        run: |
          python bas_wakeup.py

      - name: Upload BAS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas-screenshots
          path: |
            bas_manager.png
            bas_ide_after_open.png
            bas_ide_final.png
            bas_error.png
            sap_login_failed.png
          if-no-files-found: ignore
