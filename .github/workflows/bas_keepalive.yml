name: SAP BAS Keep Alive

on:
  workflow_dispatch:
  #schedule:
    #- cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: sap-bas-keepalive
  cancel-in-progress: true

jobs:

  keep-alive:

    runs-on: ubuntu-latest

    # Python 默认保持 BAS Workspace 55 分钟。
    # 每小时触发一次，避免一个 Job 无限运行。
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Start / Keep SAP BAS Dev Space
        env:
          BAS_URL: ${{ secrets.BAS_URL }}
          BAS_USERNAME: ${{ secrets.BAS_USERNAME }}
          BAS_PASSWORD: ${{ secrets.BAS_PASSWORD }}
          BAS_DEVSPACE: ${{ secrets.BAS_DEVSPACE }}
          BAS_DEVSPACE_ID: ${{ secrets.BAS_DEVSPACE_ID }}
          BAS_PROJECT_URL: ${{ secrets.BAS_PROJECT_URL }}

          # 每次 GitHub 运行时，让 BAS IDE 会话持续保持约 55 分钟
          BAS_KEEPALIVE_SECONDS: "0"
          BAS_HEARTBEAT_INTERVAL: "10"

        run: |
          python bas_wakeup.py
